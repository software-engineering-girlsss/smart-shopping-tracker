# Timing profile — activate alongside prod to enable request profiling:
#   --spring.profiles.active=prod,timing
#
# TimingFilter logs every request:  [TIMING] POST /api/v2/compare 200 | total=8432ms
# PhaseTiming logs per-phase breakdown inside compare(): openai_normalize, rewe_search, ai_match_*

logging.level.TIMING=DEBUG
logging.level.TIMING.PHASE=DEBUG

# Compact console pattern: timestamp thread level logger - message
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{15} - %msg%n

# Silence noisy Spring/Hibernate logs to keep timing output readable
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Log OkHttp wire details to see raw latency of external calls (Picnic, REWE, OpenAI)
logging.level.okhttp3=DEBUG
