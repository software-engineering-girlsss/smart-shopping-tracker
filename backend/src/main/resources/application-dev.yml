spring:
  datasource:
    url: jdbc:h2:mem:shoppingplaner;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

bucket4j:
  enabled: false

app:
  invite:
    tokens:
      - dev-test-token
  # 32-byte dev-only AES key — never use in production
  encryption-key: dGVzdC1rZXktZm9yLWRldi10ZXN0aW5nLW9ubHktZDA=

logging:
  level:
    com.shoppingplaner: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
